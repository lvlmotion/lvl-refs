<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Helvetica, Arial, sans-serif">
  <title>Sensor axes: +Z out of the face with the button and light, +Y toward the LED, +X completing a right-handed set</title>
  <defs>
    <marker id="axX" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FF5A52"/></marker>
    <marker id="axY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4CD964"/></marker>
    <marker id="axZ" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4DA3FF"/></marker>
  </defs>

  <rect x="0" y="0" width="680" height="380" rx="14" fill="#16181d"/>

  <!-- Left: top view, button and LED facing you -->
  <text x="160" y="34" fill="#e6e6e6" font-size="16" text-anchor="middle" font-weight="bold">Top view</text>
  <text x="160" y="54" fill="#9aa0a6" font-size="13" text-anchor="middle">button and LED facing you</text>
  <rect x="60" y="80" width="200" height="200" rx="28" fill="#2b2d33" stroke="#5f636b" stroke-width="2"/>
  <circle cx="160" cy="180" r="24" fill="#24262b" stroke="#80858e" stroke-width="2"/>
  <circle cx="160" cy="180" r="17" fill="none" stroke="#80858e" stroke-width="1.5"/>
  <circle cx="212" cy="180" r="7" fill="#c9ccd1" stroke="#ffffff" stroke-width="1"/>
  <text x="212" y="206" fill="#9aa0a6" font-size="11" text-anchor="middle">LED</text>
  <!-- +Y toward the LED -->
  <line x1="160" y1="180" x2="305" y2="180" stroke="#4CD964" stroke-width="4" marker-end="url(#axY)"/>
  <text x="300" y="168" fill="#4CD964" font-size="18" font-weight="bold">+Y</text>
  <!-- +X down -->
  <line x1="160" y1="180" x2="160" y2="330" stroke="#FF5A52" stroke-width="4" marker-end="url(#axX)"/>
  <text x="172" y="334" fill="#FF5A52" font-size="18" font-weight="bold">+X</text>
  <!-- +Z out of the page -->
  <circle cx="160" cy="180" r="9" fill="#16181d" stroke="#4DA3FF" stroke-width="3"/>
  <circle cx="160" cy="180" r="3" fill="#4DA3FF"/>
  <text x="96" y="160" fill="#4DA3FF" font-size="18" font-weight="bold">+Z</text>
  <text x="70" y="364" fill="#9aa0a6" font-size="12">+Z points out of the face, toward you</text>

  <!-- Right: 3D view -->
  <text x="490" y="34" fill="#e6e6e6" font-size="16" text-anchor="middle" font-weight="bold">3D view</text>
  <!-- side faces (thickness) -->
  <polygon points="368.8,190 490,260 490,291.5 368.8,221.5" fill="#1f2126" stroke="#5f636b" stroke-width="1.5"/>
  <polygon points="611.2,190 490,260 490,291.5 611.2,221.5" fill="#26282e" stroke="#5f636b" stroke-width="1.5"/>
  <!-- top face -->
  <polygon points="490,120 611.2,190 490,260 368.8,190" fill="#2b2d33" stroke="#80858e" stroke-width="2"/>
  <ellipse cx="490" cy="190" rx="24" ry="14" fill="#24262b" stroke="#80858e" stroke-width="2"/>
  <ellipse cx="523.3" cy="209.3" rx="6" ry="3.5" fill="#c9ccd1" stroke="#ffffff" stroke-width="1"/>
  <!-- axes from the centre -->
  <line x1="490" y1="190" x2="374.8" y2="256.5" stroke="#FF5A52" stroke-width="4" marker-end="url(#axX)"/>
  <text x="352" y="276" fill="#FF5A52" font-size="18" font-weight="bold">+X</text>
  <line x1="490" y1="190" x2="605.2" y2="256.5" stroke="#4CD964" stroke-width="4" marker-end="url(#axY)"/>
  <text x="608" y="278" fill="#4CD964" font-size="18" font-weight="bold">+Y</text>
  <line x1="490" y1="190" x2="490" y2="75" stroke="#4DA3FF" stroke-width="4" marker-end="url(#axZ)"/>
  <text x="502" y="82" fill="#4DA3FF" font-size="18" font-weight="bold">+Z</text>
  <circle cx="490" cy="190" r="4" fill="#ffffff"/>
  <text x="490" y="330" fill="#9aa0a6" font-size="12" text-anchor="middle">Rotation is positive counter-clockwise</text>
  <text x="490" y="348" fill="#9aa0a6" font-size="12" text-anchor="middle">when the axis points at you (right-hand rule)</text>
</svg>
